{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | Task Manager{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    /* 1. Change Header Background Color */
    :root {
        --header-bg: #2d3436;
        /* Darker grey/black */
        --primary: #6c5ce7;
        /* Purple accents */
        --header-color: #ffffff;
        /* Text color in header */
    }

    /* 2. Style your custom branding if needed */
    #branding h1 {
        color: var(--header-color);
        font-weight: bold;
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <!-- Replace this text with your Item/Brand Name -->
    <span style="margin-right: 10px;">🚀</span> Task Manager
</h1>
{% endblock %}
